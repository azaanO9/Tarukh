<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan glow for spire -->
    <radialGradient id="spireGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#0088ff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0033aa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Vertical flare linear gradient -->
    <linearGradient id="verticalFlare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="38%" stop-color="#e0f2fe" stop-opacity="1"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>

    <!-- Arc glow filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded squircle background matching tab tile -->
  <rect width="512" height="512" rx="104" fill="#000000"/>

  <!-- Background flare glow behind starlight spire -->
  <ellipse cx="256" cy="208" rx="72" ry="110" fill="url(#spireGlow)"/>

  <!-- Central Starlight Spire (vertical needle) -->
  <polygon points="256,104 259,202 264,210 256,276 248,210 253,202" fill="url(#verticalFlare)"/>
  <!-- Sharp core needle -->
  <polygon points="256,116 257.5,204 256,268 254.5,204" fill="#ffffff"/>

  <!-- Left Horizon Arc -->
  <path d="M 68 258 Q 200 178 240 198 Q 248 202 248 214" 
        fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#cyanGlow)" opacity="0.8"/>
  <path d="M 68 258 Q 200 178 240 198 Q 248 202 248 214" 
        fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Right Horizon Arc -->
  <path d="M 444 258 Q 312 178 272 198 Q 264 202 264 214" 
        fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#cyanGlow)" opacity="0.8"/>
  <path d="M 444 258 Q 312 178 272 198 Q 264 202 264 214" 
        fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>

  <!-- TARUKH Wordmark (pure geometric vector strokes) -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
    <!-- T -->
    <path d="M 68 316 H 118 M 93 316 V 358"/>
    <!-- A (geometric chevron) -->
    <path d="M 144 358 L 171 316 L 198 358" stroke-linejoin="round"/>
    <!-- R -->
    <path d="M 224 358 V 316 H 248 C 262 316, 266 324, 266 333 C 266 342, 260 346, 248 346 H 224 M 244 346 L 268 358"/>
    <!-- U -->
    <path d="M 294 316 V 345 C 294 356, 304 358, 316 358 C 328 358, 338 356, 338 345 V 316"/>
    <!-- K -->
    <path d="M 364 316 V 358 M 404 316 L 368 340 M 378 335 L 406 358"/>
    <!-- H -->
    <path d="M 432 316 V 358 M 472 316 V 358 M 432 337 H 472"/>
  </g>
</svg>